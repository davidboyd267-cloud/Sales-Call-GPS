<!doctype html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><meta name='theme-color' content='#0A0908'><title>DM GPS</title><style>:root{--bg:#0A0908;--bg1:#14120F;--bg2:#1C1A16;--bg3:#26231D;--ink:#fff;--dim:#B8B2A4;--faint:#6F6A5D;--line:#2E2B24;--accent:#FFB020;--soft:#FFD166;--hot:#FF4D4D;--cold:#4DA6FF;--good:#4ADE80;--stop:#FF6B6B;--link:#4DA6FF}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:100px}.hdr{padding:18px 18px 14px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.hdr-title{font-size:22px;font-weight:900;letter-spacing:-.5px}.hdr-title span{color:var(--accent)}.hdr-sub{font-size:12px;color:var(--faint);letter-spacing:.5px;text-transform:uppercase;font-weight:700}.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:99;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1;min-width:80px;background:none;border:0;color:var(--faint);padding:14px 6px;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.panel{display:none;padding:20px 16px 40px}.panel.active{display:block}.intro{background:var(--bg1);border-left:3px solid var(--accent);padding:12px 14px;border-radius:6px;margin-bottom:20px;font-size:13px;color:var(--dim)}.intro strong{color:var(--accent)}.temp-box,.rules,.chips,.cue,.acc{background:var(--bg1);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.temp-box{padding:14px;margin-bottom:20px}.temp-title,.rules-title,.cue-title{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-bottom:10px}.temp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.temp-card{padding:12px 8px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);text-align:center}.temp-card.hot{border-color:rgba(255,77,77,.35)}.temp-card.warm{border-color:rgba(255,176,32,.35)}.temp-card.cold{border-color:rgba(77,166,255,.35)}.temp-label{font-size:13px;font-weight:900}.hot .temp-label{color:var(--hot)}.warm .temp-label{color:var(--accent)}.cold .temp-label{color:var(--cold)}.temp-desc{font-size:10px;color:var(--faint);margin-top:4px}.temp-note{font-size:12px;color:var(--dim);margin-top:10px;text-align:center;font-style:italic}.sec{font-size:11px;font-weight:900;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase;margin:28px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:116px}.sub{font-size:15px;font-weight:800;margin:18px 0 8px}.note{font-size:12px;color:var(--faint);font-style:italic;margin-bottom:10px}.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px}.chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;text-decoration:none}.acc{overflow:hidden}.acc-head{padding:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;cursor:pointer}.acc-chev{color:var(--accent);font-size:20px;transition:.2s}.acc.open .acc-chev{transform:rotate(90deg)}.acc-body{display:none;padding:0 12px 12px}.acc.open .acc-body{display:block}.msg{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}.msg.best{background:linear-gradient(180deg,rgba(255,176,32,.12),rgba(255,176,32,.03));border-color:rgba(255,176,32,.42)}.msg.link{background:linear-gradient(180deg,rgba(77,166,255,.12),rgba(77,166,255,.03));border-color:rgba(77,166,255,.42)}.msg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.msg-tag{font-size:10px;font-weight:900;letter-spacing:.8px;color:var(--faint);text-transform:uppercase}.best .msg-tag{color:var(--accent)}.link .msg-tag{color:var(--link)}.copy{border:0;background:rgba(255,176,32,.12);color:var(--soft);padding:6px 11px;border-radius:20px;font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;font-family:inherit;white-space:nowrap}.copy.done{background:var(--good);color:var(--bg)}.copy.fail{background:var(--stop);color:var(--bg)}.msg-body{font-size:15px;color:var(--ink);word-break:break-word}.msg-body a{color:var(--link)}.cue{border-left:3px solid var(--cold);padding:12px 14px;margin-top:22px}.cue-title{color:var(--cold)}ul{list-style:none}.cue li,.rules li{font-size:13px;color:var(--dim);padding:5px 0;line-height:1.45}.cue span,.rules strong{color:var(--accent);font-weight:900}.rules{padding:14px;margin-top:24px}.rules-title{color:var(--accent)}.stop-box{border:1px solid var(--stop);background:rgba(255,107,107,.06);border-radius:10px;padding:14px;margin-top:20px}.stop-title{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--stop);text-transform:uppercase;margin-bottom:8px}.stop-box li{font-size:13px;color:var(--dim);padding:5px 0}.stop-box p{font-size:13px;color:var(--dim);margin-top:8px;font-style:italic}.top{position:fixed;right:20px;bottom:20px;z-index:200;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--bg);border:0;font-size:22px;font-weight:900;display:none;box-shadow:0 4px 20px rgba(255,176,32,.4)}.top.show{display:block}</style></head><body><header class='hdr'><div class='hdr-row'><div class='hdr-title'>DM <span>GPS</span></div><div class='hdr-sub'>Speed Mode</div></div><div class='hdr-sub'>App = intent · Form = qualify · Call = sell</div></header><nav class='tabs' id='tabs'></nav><main id='app'></main><button class='top' id='top'>↑</button><script>const FORM='https://docs.google.com/forms/d/e/1FAIpQLSfd8j0yqy0gfXRAHi7ufykUd3GP-GJzRUUVXOw5z9jjb1dfzw/viewform';const BOOK='http://www.trainerize.me/app/booking/419671/13885872/9971524';const RES='https://linktr.ee/Thurldave';const TABS=[['entry','Entry'],['intent','Intent'],['form','Form'],['call','Call'],['booked','Booked'],['followup','Follow Up']];function card(tag,text,best=true,link=false){return {tag,text,best,link}}function acc(title,cards,note=''){return {type:'acc',title,note,cards}}function sec(id,title){return {type:'sec',id,title}}function sub(title){return {type:'sub',title}}function note(text){return {type:'note',text}}function cue(title,items){return {type:'cue',title,items}}const DATA={entry:{intro:'Stage 1. Open the convo. Find out why she matched. Don\'t run a full sales process here.',blocks:[{type:'temp'},sec('e-main','Main opener'),card('Main','Hey, I appreciate the match 💪🏾 Not sure if you read my profile, so I gotta ask, are you here because you\'re working on your fitness goals, or were you just swiping? lol'),card('Short','Hey, appreciate the match. You here for the trainer side or just swiping?',false),sec('e-branches','Her reply branches'),acc('Said fitness',[card('Best','Bet. I have everyone fill out a form first so I can see what\'s really going on, if I\'m the right fit to help, and what the next step would be. If it makes sense, I\'ll have you book a call. If not, I\'ll still point you in the right direction. You cool with that?')],'Skip discovery. Pitch the form.'),acc('Just swiping',[card('Best','Lol I respect it. Now I\'m curious though, what caught your eye? 👀'),card('Alt','Fair enough 😂 what made you match then?',false)]),acc('Flirty',[card('Best','Lol I appreciate that. Just to be upfront, I\'m in a relationship, but I do use this to network and connect with people who need help with fitness. You working on any fitness goals right now, or nah?')],'Hold frame. Redirect once. Don\'t chase.'),acc('Both, fitness and dating',[card('Best','Lol I respect the honesty. Just to be upfront, I\'m in a relationship, so I only use this to network and connect with people who need help with fitness. On the fitness side, are you actually looking for help with anything right now?')]),acc('Both, fitness and just swiping',[card('Best','Lol I respect that. So on the fitness side, you actually looking for help with anything right now or more so just curious?'),card('Alt','Bet, I appreciate the honesty 😂 on the fitness side though, what you working on?',false),card('Alt','Lol fair enough. So you actually trying to handle some fitness goals, or you just felt like swiping today?',false)]),acc('Didn\'t read profile',[card('Best','All good lol. I\'m a trainer, so I mainly use this to connect with people who need help with fitness. Are you working on any goals right now, or were you just swiping?')]),acc('You swiped first / just returned the favor',[card('Best','Lol that\'s fair. But I figured if you matched back, you probably peeped my profile and saw what I\'m about. So fitness wise, you got anything you trying to work on, or nah?'),card('Alt','Lol valid 😂 but matching back means you saw the profile too, right? So on the fitness side, you working on anything?',false),card('Alt','Ha that\'s true. Figured though, if you matched back you probably saw I\'m a trainer. You on a fitness journey or thinking about starting one?',false),card('Alt','Lol I\'ll give you that. Most people peep the profile before they match back though, so figured you saw the trainer thing. What you working on fitness wise?',false)]),acc('No fitness goals',[card('Best','All good, I respect it. If that ever changes, you know where to find me 💪🏾')],'Let it go. Leave the door open.'),acc('No money / just want free game',[card('Message 1','I hear you. If you\'re not in a spot to invest right now, that\'s cool. I\'m not gonna force it.'),card('Message 2','Best free game I can give you is this: start with protein at every meal, 7k to 10k steps a day, and 3 simple workouts a week. Don\'t make it fancy yet.'),card('Message 3','I\'ll drop my resources here too. When you\'re ready for real structure, you can reach back out. '+RES)],'Acknowledge. Give one small piece. Leave the door cracked.'),acc('Just here for friends',[card('Redirect once','All good, I respect that. I mainly use this to network and connect with people around fitness. Are you working on any fitness goals right now, or nah?'),card('If she doubles down','Bet, I respect it. If that ever changes, you know where to find me.')]),cue('Where to go next',[['She said fitness clearly','Form'],['She\'s vague or thinking about it','Intent'],['She\'s getting chatty about a struggle','Intent → Chatty'],['No money / free game','Give one small resource → Let it go'],['Flirty after redirect, dry, dodging','Follow Up']])]},intent:{intro:'Stage 2. Confirm she actually wants help right now. Don\'t run full discovery. If she gets chatty, ride it briefly then push to form.',blocks:[sec('i-confirm','Confirm intent'),acc('Clear fitness intent',[card('Best','Bet. I have everyone fill out a form first so I can see what\'s really going on, if I\'m the right fit to help, and what the next step would be. If it makes sense, I\'ll have you book a call. If not, I\'ll still point you in the right direction. You cool with that?')]),acc('Vague, kinda, maybe, get back in shape',[card('Best','Got you. Are you actually looking for help with that right now, or more so just thinking about it?')]),acc('Looking for help',[card('Best','Bet. I have everyone fill out a form first so I can see what\'s really going on, if I\'m the right fit to help, and what the next step would be. If it makes sense, I\'ll have you book a call. If not, I\'ll still point you in the right direction. You cool with that?')]),acc('Just thinking about it',[card('Best','That\'s fair. What\'s making you think about it now?')]),sec('i-chatty','If she gets chatty before the form'),note('Use this only if she opens up. One or two replies max, then push to the form.'),acc('Weight loss / falling off',[card('Best','Yeah, that makes sense. A lot of people get stuck there. Is it more the food, the workouts, or staying consistent?')]),acc('Food is the problem',[card('Best','Yeah, I get that. Food is usually the part that makes or breaks it. Is it more cravings, eating out, or not knowing what to eat?')]),acc('Can\'t stay consistent',[card('Best','Yeah, that\'s real. Most people don\'t have a motivation problem, they have a structure problem. What usually knocks you off?')]),acc('Schedule is crazy / busy',[card('Best','Yeah, that makes sense. Busy schedules throw a lot of people off. Is it more not having time, or being too tired when you do have time?')]),sec('i-pivot','Pivot from chatty to form'),card('Best','Yeah, that makes sense. This is exactly why I have everyone fill out the form first, because it gives me the full picture before I say what the next step should be. You cool with that?'),cue('Move on',[['She said yes to the form','Form'],['She\'s stalling','Follow Up']])]},form:{intro:'Stage 3. Move off app, send the form, handle objections, review when she\'s done.',chips:[['f-offapp','1. Off app'],['f-send','2. Send form'],['f-done','3. She\'s done'],['f-review','4. Review'],['f-objections','Objections']],blocks:[sec('f-offapp','1. Move off app'),note('She agreed to the form. Get her off the app first.'),sub('Ask for number or IG'),card('Best','Cool, what\'s your number or IG? I can\'t send links on here.'),sub('If she asks why you need her number'),card('Best','All good. The only reason I ask is because the form is gonna ask for your number anyway so I can follow up after I look it over. What\'s easier for you, number or IG?'),sub('If she says just send it here'),card('Best','I can try, but this app be weird with links sometimes. If it doesn\'t work, I\'ll need your number or IG.'),sub('If she picks IG'),card('Best','Cool, send it over and I\'ll send the form there.'),sec('f-send','2. Send the form'),note('Send these in order. Two messages, link in the second one.'),card('Message A','Hey, it\'s Trainer Dave. Here\'s the form I was talking about. Fill it out when you get a chance today.'),card('Message B','I only take on a certain amount of people at once, so this helps me see if it actually makes sense before we hop on a call. '+FORM),card('Form link only',FORM,true,true),sec('f-done','3. After she finishes'),card('Best','Dope, I got it. Appreciate you filling that out. Give me up to 48 hours to look it over, and I\'ll come back with the next step.'),sec('f-review','4. After you review it'),sub('Good fit, go to Call'),card('Full frame','Hey, I looked over your form and I do think it makes sense for us to hop on a call. On the call, we\'ll go over your #1 goal, your #1 struggle, what\'s been getting in the way, and I\'ll let you know if I can actually help. If I can, I\'ll show you what that would look like. If not, you\'ll still leave with value either way. Sound good?'),card('Clear structure','Hey, looked over your form. Based on what you wrote, this looks like something I can help with. The call\'s where we go deeper on your goal, what\'s really been blocking you, and I lay out exactly what working together would look like. Roughly 30 min to an hour. You good to lock in a time?',false),card('Sets expectation','Hey, went through your form. I think we should hop on a call. Heads up so you know what to expect, it\'s not a casual chat. We\'ll go through your goal, what\'s been in the way, where you\'re at right now, and by the end you\'ll know if working together makes sense. Plan for 30 min to an hour. You down?',false),card('Shorter','Hey, I looked over your form and yeah, makes sense for us to hop on. On the call I\'ll go through everything with you, your goal, your main struggle, what you\'ve tried, and I\'ll show you what the next step looks like if I think I can help. You good to grab a time?',false),sub('Not ready yet, send resources'),card('Message 1','Hey, I appreciate you filling out the form. Based on what you wrote, I don\'t think my coaching would be the best fit for where you\'re at right now.'),card('Message 2','That said, I still want to point you in the right direction. Here are some resources that can help you start building better habits. '+RES),card('Message 3','Keep going. When you feel ready for more structure, you can always reach back out.'),sub('Not a fit at all'),card('Message 1','Hey, I appreciate you filling out the form. Based on what you wrote, I don\'t think I\'d be the right coach for what you need right now.'),card('Message 2','I\'d rather be honest than force something that doesn\'t make sense. I still hope you keep going though.'),sec('f-objections','Objections before the form'),acc('How much is it?',[card('Best','I get why you\'re asking. I don\'t really throw out prices before I know what you actually need because I have different options depending on the person. That\'s why I have people fill out the form first. It helps me see your goals, your situation, and if I\'m even the right fit. You cool with doing that first?')]),acc('Just tell me the price',[card('Best','I hear you. I just wouldn\'t feel right giving you a random number without knowing what you need help with first. Some people need full coaching, some people just need direction, and some people are not a fit yet. That\'s why the form comes first. You want me to send it over?')]),acc('Not ready yet',[card('Best','That\'s fair. What makes you feel like you\'re not ready right now?')]),acc('Need to think about it',[card('Best','Yeah, that makes sense. What part are you thinking through, the fitness part, the time, or just whether coaching makes sense for you?')]),acc('What does coaching include?',[card('Best','It depends on what you need, but usually it\'s training, nutrition structure, check-ins, accountability, and support so you\'re not guessing week to week. The form helps me see what would actually make sense for you.')]),cue('Move on',[['Reviewed and good fit','Call'],['Form not done yet','Follow Up → Form not done']])]},call:{intro:'Stage 4. Form looked good. You already told her it makes sense to hop on. Now send the booking link.',blocks:[sec('c-link','Send the booking link'),card('Best','Here\'s my booking link. After you book, send me the time you picked so I can lock you in on my end. '+BOOK),sub('Or send the link clean by itself'),card('Booking link only',BOOK,true,true),sec('c-manual','Manual times if the link breaks'),card('Best','Let\'s just lock it in here. I got [day at time], [day at time], or [day at time]. Which one works?'),cue('Move on',[['She booked','Booked'],['She didn\'t book','Follow Up → Form done, no booking']])]},booked:{intro:'Stage 5. Call is on the books. Keep it warm without being extra.',chips:[['b-confirm','Confirm'],['b-daybefore','Day before'],['b-dayof','Day of'],['b-warmup','Warm up'],['b-show','Show up'],['b-ghost','Quiet'],['b-noshow','No show'],['b-resched','Reschedule']],blocks:[sec('b-confirm','Right after she books'),card('Best','Bet, got you down for [day/time]. Talk to you then.'),card('Alt','Locked in for [day/time]. I\'ll hit you up then.',false),sec('b-daybefore','Day before'),card('Best','Yo, just a heads up we\'re on for [time] tomorrow. Shoot me a quick yes so I know we\'re still good.'),sec('b-dayof','Day of'),card('Best','Morning, we\'re on for [time] today. I\'ll give you a ring then, be ready to actually talk about what you want.'),sec('b-warmup','Hour before'),note('Call usually runs 30 min to an hour.'),card('Best','Bout to hop on with you in a bit. Be somewhere you can actually talk for 30 min to an hour.'),sec('b-show','Improve show-up'),card('Best','Looking forward to this. Come in with whatever you\'re honestly trying to fix, I\'ll meet you there.'),card('Alt','Pen and paper ready. Goal is you leave this call with a real plan, whether we work together or not.',false),sec('b-ghost','Quiet before the call'),card('Best','Hey, just making sure we\'re still good for [day/time]. If something came up, no worries, let me know.'),card('Alt','Yo, checking in. We still on for [day/time] or do we need to move it?',false),sec('b-noshow','No show'),card('Best','Hey, must\'ve been a rough one today, life happens. Lmk when you\'re good and we can find a new time.'),card('Alt','Hope you\'re good. Looks like we missed each other, no stress. Hit me back when you wanna lock in a new time.',false),card('Alt','Hey, no worries about the call today. Whenever you\'re ready to reschedule, just hit me.',false),sec('b-resched','Reschedule'),card('Best','No stress, when\'s better? I got [option 1], [option 2], or [option 3].')]},followup:{intro:'Stage 6. Pure recovery. Form-related stalls up top, that\'s where most leads slip.',chips:[['fu-formundone','Form not done'],['fu-nobook','Form done, no book'],['fu-ghosted','Booked, ghost'],['fu-noshow','No show'],['fu-resched','Reschedule'],['fu-stop','Stop']],blocks:[sec('fu-formundone','Form not done'),note('3-step sequence. Space them out. Don\'t spam.'),sub('Follow up 1'),card('Best','Hey, did you get a chance to look at the form yet? No rush, just checking because I only review them when I know somebody actually wants help.'),sub('Follow up 2'),card('Best','Hey, just checking in. Still want me to look over your form when you finish it, or are you good for now?'),sub('Final follow up'),card('Best','All good if now isn\'t the time. I\'m gonna leave the ball in your court. If you still want help, fill it out and I\'ll take a look.'),sec('fu-nobook','Form done, didn\'t book'),sub('Follow up 1'),card('Best','Hey, did you get a chance to pick a time yet? I want to make sure I hold the right spot for you.'),sub('Follow up 2'),card('Best','Just checking in. Do you still want to talk through this, or are you holding off for now?'),sub('Final follow up'),card('Best','All good either way. I just don\'t want to keep bugging you if now isn\'t the right time.'),sec('fu-ghosted','Booked but ghosted before call'),card('Best','Hey, just making sure we\'re still good for [day/time]. If something came up, no worries, let me know.'),card('Alt','Yo, checking in. We still on or do we need to move it?',false),sec('fu-noshow','No show'),card('Best','Hey, must\'ve been a rough one today, life happens. Lmk when you\'re good and we can find a new time.'),card('Alt','Hope you\'re good. Looks like we missed each other, no stress. Hit me back when you wanna lock in a new time.',false),card('Soft close','Hey, figured I\'d check in. If the timing isn\'t right, I get it. Door\'s open whenever you wanna pick this back up.',false),sec('fu-resched','Reschedule'),card('Best','No stress, when\'s better? I got [option 1], [option 2], or [option 3].'),sec('fu-stop','Stop'),{type:'stop'}, {type:'rules'}]}};function esc(s){return String(s).replace(/[&<>]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]))}function linkify(s){return esc(s).replace(/https?:\/\/\S+/g,u=>`<a href='${u}' target='_blank' rel='noopener'>${u}</a>`)}function renderCard(c){let cls='msg '+(c.best?'best ':'')+(c.link?'link':'');return `<div class='${cls}' data-copy='${esc(c.text)}'><div class='msg-head'><span class='msg-tag'>${esc(c.tag)}</span><button class='copy' type='button'>Copy</button></div><div class='msg-body'>${linkify(c.text)}</div></div>`}function renderBlock(b){if(b.type==='sec')return `<div class='sec' id='${b.id}'>${esc(b.title)}</div>`;if(b.type==='sub')return `<div class='sub'>${esc(b.title)}</div>`;if(b.type==='note')return `<div class='note'>${esc(b.text)}</div>`;if(b.type==='temp')return `<div class='temp-box'><div class='temp-title'>Read the temp</div><div class='temp-grid'><div class='temp-card hot'><div class='temp-label'>HOT</div><div class='temp-desc'>Fast, long, open, asks back</div></div><div class='temp-card warm'><div class='temp-label'>WARM</div><div class='temp-desc'>Replying, some interest, guarded</div></div><div class='temp-card cold'><div class='temp-label'>COLD</div><div class='temp-desc'>Dry, vague, dodging, flirty only</div></div></div><div class='temp-note'>A match by itself is warm by default.</div></div>`;if(b.type==='acc')return `<div class='acc' data-acc><div class='acc-head'><span>${esc(b.title)}</span><span class='acc-chev'>›</span></div><div class='acc-body'>${b.note?`<div class='note'>${esc(b.note)}</div>`:''}${b.cards.map(renderCard).join('')}</div></div>`;if(b.type==='cue')return `<div class='cue'><div class='cue-title'>${esc(b.title)}</div><ul>${b.items.map(i=>`<li><strong>${esc(i[0])}: </strong><span>${esc(i[1])}</span></li>`).join('')}</ul></div>`;if(b.type==='stop')return `<div class='stop-box'><div class='stop-title'>When to let it go</div><ul><li>Never engages fitness after 2 redirects</li><li>Says no to the form twice</li><li>Ghosts after final follow up</li><li>Only flirts, no fitness intent</li><li>Your energy feels forced every reply</li></ul><p>Your time is ammo. Spend it on leads that are actually moving.</p></div>`;if(b.type==='rules')return `<div class='rules'><div class='rules-title'>Speed Mode rules</div><ul><li>If she clearly says <strong>fitness</strong>, send the form pitch.</li><li>If she is <strong>vague</strong>, ask if she is actually looking for help right now.</li><li>If she is <strong>just swiping</strong>, ask what caught her eye.</li><li>If she <strong>flirts</strong>, redirect once. Then let it go.</li><li>If she <strong>asks price</strong>, redirect to the form.</li><li>If she <strong>agrees to the form</strong>, move off app.</li><li>Form fits, send booking link. Form does not fit, send resources.</li><li>App = intent. Form = qualify. Call = sell.</li></ul></div>`;return renderCard(b)}function render(){document.getElementById('tabs').innerHTML=TABS.map((t,i)=>`<button class='tab ${i?'':'active'}' data-tab='${t[0]}'>${t[1]}</button>`).join('');document.getElementById('app').innerHTML=TABS.map((t,i)=>{let d=DATA[t[0]];return `<section class='panel ${i?'':'active'}' id='${t[0]}'><div class='intro'><strong>${esc(d.intro.split('.')[0])}.</strong>${esc(d.intro.slice(d.intro.indexOf('.')+1))}</div>${d.chips?`<div class='chips'>${d.chips.map(c=>`<a class='chip' href='#${c[0]}'>${esc(c[1])}</a>`).join('')}</div>`:''}${d.blocks.map(renderBlock).join('')}</section>`}).join('');bind()}function mark(btn,txt,cls){let old=btn.textContent;btn.textContent=txt;btn.classList.add(cls);setTimeout(()=>{btn.textContent=old;btn.classList.remove(cls)},1200)}function fallback(text,btn){let ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);mark(btn,ok?'COPIED':'BLOCKED',ok?'done':'fail')}function copyText(text,btn){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>mark(btn,'COPIED','done')).catch(()=>fallback(text,btn))}else fallback(text,btn)}function bind(){document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));x.classList.add('active');document.getElementById(x.dataset.tab).classList.add('active');scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('.acc-head').forEach(h=>h.onclick=()=>h.closest('.acc').classList.toggle('open'));document.querySelectorAll('.chip').forEach(ch=>ch.onclick=e=>{let id=ch.getAttribute('href').slice(1),el=document.getElementById(id);if(el){e.preventDefault();scrollTo({top:el.getBoundingClientRect().top+pageYOffset-112,behavior:'smooth'})}});document.querySelectorAll('.msg').forEach(m=>{let btn=m.querySelector('.c
